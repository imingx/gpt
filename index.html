<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <style>
        :root {
            --sidebar-bg: #202123;
            --main-bg: #343541;
            --text-color: #ececf1;
            --input-bg: #40414f;
            --message-ai-bg: #444654;
            --border-color: rgba(255,255,255,0.1);
            --sidebar-hover: #2a2b32;
            --button-primary: #10a37f;
        }

        body.light-mode {
            --sidebar-bg: #f9f9f9;
            --main-bg: #ffffff;
            --text-color: #374151;
            --input-bg: #ffffff;
            --message-ai-bg: #f7f7f8;
            --border-color: rgba(0,0,0,0.1);
            --sidebar-hover: #ececf1;
            --button-primary: #10a37f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 10px;
            height: 100%;
            border-right: 1px solid var(--border-color);
            transition: background-color 0.3s;
        }

        .new-chat {
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .new-chat:hover {
            background-color: var(--sidebar-hover);
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .history-item:hover {
            background-color: var(--sidebar-hover);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .footer-btn {
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .footer-btn:hover {
            background-color: var(--sidebar-hover);
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .messages-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 150px;
        }

        .message {
            padding: 24px 10%;
            display: flex;
            gap: 20px;
            line-height: 1.6;
        }

        .message.ai {
            background-color: var(--message-ai-bg);
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .avatar.user { background-color: #5436da; }
        .avatar.ai { background-color: #10a37f; color: white; }

        .content {
            font-size: 16px;
            max-width: 100%;
        }

        code {
            background-color: rgba(0,0,0,0.3);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }

        .code-block {
            background-color: #000;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            font-family: monospace;
            position: relative;
        }

        /* Input Area */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15%;
            background: linear-gradient(transparent, var(--main-bg) 20%);
        }

        .input-container {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            align-items: flex-end;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: inherit;
            resize: none;
            outline: none;
            font-size: 16px;
            max-height: 200px;
            padding: 5px 0;
        }

        .send-btn {
            background-color: var(--button-primary);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 8px;
            cursor: pointer;
            margin-left: 10px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .send-btn.active {
            opacity: 1;
        }

        .disclaimer {
            text-align: center;
            font-size: 12px;
            color: #8e8ea0;
            margin-top: 10px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #565869; border-radius: 10px; }
        body.light-mode ::-webkit-scrollbar-thumb { background: #c5c5d2; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="new-chat">
            <span>+</span> New chat
        </div>
        <div class="chat-history" id="history-list">
            <div class="history-item active" data-id="default">💬 New Conversation</div>
            <div class="history-item" data-id="js-learn">💬 How to learn Javascript</div>
            <div class="history-item" data-id="us-table">💬 American Style Table</div>
            <div class="history-item" data-id="pizza">💬 Recipe for Pizza</div>
        </div>
        <div class="sidebar-footer">
            <div class="footer-btn" id="theme-toggle">
                <span id="theme-icon">🌙</span> Dark Mode / Light Mode
            </div>
            <div class="footer-btn">
                <span>⚙️</span> Settings
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-header" id="chat-title">ChatGPT Clone v1.0</div>
        
        <div class="messages-container" id="chat-box">
            <!-- Messages will appear here -->
        </div>

        <div class="input-area">
            <div class="input-container">
                <textarea id="user-input" placeholder="Send a message..." rows="1"></textarea>
                <button class="send-btn" id="send-btn">➔</button>
            </div>
            <div class="disclaimer">
                Free Research Preview. This is a UI clone.
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const historyList = document.getElementById('history-list');
        const chatTitle = document.getElementById('chat-title');

        // Mock Data for conversations
        const conversations = {
            'default': [
                { sender: 'ai', text: "Hello! I am a ChatGPT clone UI. How can I help you today?" }
            ],
            'js-learn': [
                { sender: 'user', text: "How to learn Javascript?" },
                { sender: 'ai', text: "Start with basics like variables, then move to functions and DOM manipulation! ```\nconsole.log('Learn JS');\n```" }
            ],
            'us-table': [
                { sender: 'user', text: "Show me the American style table." },
                { sender: 'ai', text: "It's all about Red, White, and Blue! 🇺🇸" }
            ],
            'pizza': [
                { sender: 'user', text: "Recipe for Pizza?" },
                { sender: 'ai', text: "You need dough, tomato sauce, and lots of cheese! 🍕" }
            ]
        };

        let currentChatId = 'default';

        function loadConversation(id) {
            currentChatId = id;
            chatBox.innerHTML = '';
            
            // Highlight active item
            document.querySelectorAll('.history-item').forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-id') === id) {
                    item.classList.add('active');
                    chatTitle.innerText = item.innerText.replace('💬 ', '');
                }
            });

            const msgs = conversations[id] || [];
            msgs.forEach(msg => addMessage(msg.text, msg.sender, false));
        }

        // Add CSS for active state
        const style = document.createElement('style');
        style.innerHTML = '.history-item.active { background-color: var(--sidebar-hover); border-left: 3px solid var(--button-primary); }';
        document.head.appendChild(style);

        // Sidebar History Click
        historyList.addEventListener('click', (e) => {
            const item = e.target.closest('.history-item');
            if (item) {
                const id = item.getAttribute('data-id');
                loadConversation(id);
            }
        });

        // Initialize with default chat
        loadConversation('default');

        // Auto-resize textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
            
            if (userInput.value.trim() !== "") {
                sendBtn.classList.add('active');
            } else {
                sendBtn.classList.remove('active');
            }
        });

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeIcon.textContent = isLight ? '☀️' : '🌙';
        });

        // Send Message
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add User Message
            addMessage(text, 'user');
            
            // Save to mock data
            if (!conversations[currentChatId]) conversations[currentChatId] = [];
            conversations[currentChatId].push({ sender: 'user', text: text });

            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.classList.remove('active');

            // Add Loading Indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai loading';
            loadingDiv.innerHTML = `
                <div class="avatar ai">G</div>
                <div class="content"><i>Thinking...</i></div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Using Pollinations AI - a free, no-auth API
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
                const aiResponse = await response.text();
                
                // Remove Loading
                chatBox.removeChild(loadingDiv);

                // Add Real Message
                addMessage(aiResponse, 'ai');
                conversations[currentChatId].push({ sender: 'ai', text: aiResponse });
            } catch (error) {
                chatBox.removeChild(loadingDiv);
                addMessage("Sorry, I'm having trouble connecting to the brain. Please try again later.", 'ai');
            }
        }

        function addMessage(text, sender, scroll = true) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${sender}`;
            avatar.textContent = sender === 'user' ? 'U' : 'G';

            const content = document.createElement('div');
            content.className = 'content';
            
            // Basic formatting for the API response
            if (text.includes('```')) {
                const parts = text.split('```');
                let formattedHtml = '';
                parts.forEach((part, index) => {
                    if (index % 2 === 1) {
                        formattedHtml += `<div class="code-block">${part.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
                    } else {
                        formattedHtml += part.replace(/\n/g, '<br>');
                    }
                });
                content.innerHTML = formattedHtml;
            } else {
                content.innerHTML = text.replace(/\n/g, '<br>');
            }

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);
            chatBox.appendChild(msgDiv);
            
            if (scroll) {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // Event Listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>

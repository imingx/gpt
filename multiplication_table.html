<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American Style Multiplication Table</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Roboto:wght@400;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            background: #002868; /* Navy Blue */
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Stars Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* Stripes Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 50px,
                rgba(191, 10, 48, 0.05) 50px,
                rgba(191, 10, 48, 0.05) 100px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .container {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* American Billboard Style */
        .billboard-container {
            background: #ffffff;
            border: 8px solid #BF0A30; /* Old Glory Red */
            border-radius: 4px;
            box-shadow: 10px 10px 0px #001535;
            padding: 40px 30px;
            position: relative;
            color: #002868;
        }

        /* Star Decorations */
        .star-decoration {
            position: absolute;
            font-size: 24px;
            color: #BF0A30;
        }
        .star-tl { top: 10px; left: 10px; }
        .star-tr { top: 10px; right: 10px; }
        .star-bl { bottom: 10px; left: 10px; }
        .star-br { bottom: 10px; right: 10px; }

        h1 {
            font-family: 'Bungee', cursive;
            text-align: center;
            color: #BF0A30;
            font-size: 56px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 4px 4px 0px #eeeeee, 8px 8px 0px #002868;
        }

        .subtitle {
            text-align: center;
            color: #002868;
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* Table Container */
        .table-wrapper {
            background: #f8f9fa;
            border: 4px solid #002868;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            margin: 0 auto;
            width: 100%;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 2px solid #dee2e6;
            color: #002868;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        td:hover {
            background: #BF0A30;
            color: #ffffff;
            transform: scale(1.1) rotate(2deg);
            z-index: 10;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }

        .header-cell, .row-header {
            background: #002868;
            color: #ffffff;
            font-family: 'Bungee', cursive;
            font-size: 20px;
            border: 2px solid #ffffff;
        }

        /* Confetti Canvas */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-weight: 900;
            color: #BF0A30;
            text-transform: uppercase;
        }

        .eagle-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <canvas id="confetti"></canvas>

    <div class="container">
        <div class="billboard-container">
            <span class="star-decoration star-tl">★</span>
            <span class="star-decoration star-tr">★</span>
            <span class="star-decoration star-bl">★</span>
            <span class="star-decoration star-br">★</span>

            <span class="eagle-icon" style="text-align: center;">🦅</span>
            <h1>Multiplication</h1>
            <p class="subtitle">The Great American Table</p>

            <div class="table-wrapper">
                <table id="multiplicationTable"></table>
            </div>

            <div class="footer">
                In Math We Trust ★ 2026
            </div>
        </div>
    </div>

    <script>
        // Stars Background
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');

        function resize() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            cfCanvas.width = window.innerWidth;
            cfCanvas.height = window.innerHeight;
        }

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * bgCanvas.width;
                this.y = Math.random() * bgCanvas.height;
                this.size = Math.random() * 2 + 1;
                this.blink = Math.random() * 0.05;
                this.opacity = Math.random();
            }
            draw() {
                this.opacity += this.blink;
                if (this.opacity > 1 || this.opacity < 0) this.blink *= -1;
                bgCtx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                bgCtx.beginPath();
                bgCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                bgCtx.fill();
            }
        }

        const stars = Array.from({length: 100}, () => new Star());

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            stars.forEach(s => s.draw());
            requestAnimationFrame(animateBg);
        }

        // Confetti Effect
        const cfCanvas = document.getElementById('confetti');
        const cfCtx = cfCanvas.getContext('2d');
        let particles = [];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 4;
                this.color = ['#BF0A30', '#002868', '#ffffff', '#FFD700'][Math.floor(Math.random() * 4)];
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10 - 5;
                this.gravity = 0.2;
                this.life = 1;
            }
            update() {
                this.vx *= 0.99;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.01;
            }
            draw() {
                cfCtx.fillStyle = this.color;
                cfCtx.globalAlpha = this.life;
                cfCtx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        function burst(x, y) {
            for(let i=0; i<30; i++) particles.push(new Particle(x, y));
        }

        function animateCf() {
            cfCtx.clearRect(0, 0, cfCanvas.width, cfCanvas.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateCf);
        }

        // Table Generation
        const table = document.getElementById('multiplicationTable');
        
        // Header
        const hRow = document.createElement('tr');
        hRow.innerHTML = '<td class="header-cell">X</td>' + 
            Array.from({length:9}, (_, i) => `<td class="header-cell">${i+1}</td>`).join('');
        table.appendChild(hRow);

        // Rows
        for(let i=1; i<=9; i++) {
            const row = document.createElement('tr');
            row.innerHTML = `<td class="row-header">${i}</td>` + 
                Array.from({length:9}, (_, j) => `<td>${i}×${j+1}=${i*(j+1)}</td>`).join('');
            
            // Add click event for confetti
            Array.from(row.cells).forEach((cell, idx) => {
                if(idx === 0) return;
                cell.onclick = (e) => burst(e.clientX, e.clientY);
            });
            
            table.appendChild(row);
        }

        window.onresize = resize;
        resize();
        animateBg();
        animateCf();

        // Initial celebration
        setTimeout(() => {
            burst(window.innerWidth/4, window.innerHeight/2);
            burst(window.innerWidth*3/4, window.innerHeight/2);
        }, 500);
    </script>
</body>
</html>
